name: Build OneCore SDK & Loader

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Generate Release Keystore
      run: |
        keytool -genkey -v -keystore release.keystore -alias onecore -keyalg RSA -keysize 2048 -validity 10000 -storepass onecore123 -keypass onecore123 -dname "CN=OneCore SDK, O=OneCore, C=US"

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build SDK and Loader
      run: ./gradlew :sdk:assembleRelease :loader:assembleRelease --no-daemon --stacktrace

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OneCore-Releases
        path: |
          loader/build/outputs/apk/release/*.apk
          sdk/build/outputs/aar/*.aar
